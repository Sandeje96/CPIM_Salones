<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Login - CPIM Salones</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; height: 100vh; background-color: var(--bg); }
        .login-card {
            background-color: var(--surface);
            padding: 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border);
        }
        .login-card h1 { text-align: center; margin-bottom: 20px; color: var(--cpim-primary-dark); }
        .error { color: var(--danger); background-color: var(--danger-soft); padding: 10px; border-radius: var(--radius-sm); margin-bottom: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>CPIM Salones</h1>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/admin/login">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" class="form-control" required autofocus>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Ingresar</button>
        </form>
    </div>
</body>
</html>
