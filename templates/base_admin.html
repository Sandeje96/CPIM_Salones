<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Administración - CPIM Salones</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        body { background-color: var(--bg); display: flex; min-height: 100vh; }
        .sidebar {
            width: 250px;
            background-color: var(--surface);
            border-right: 1px solid var(--border);
            padding: 20px 0;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 0 20px 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .sidebar-header h2 { color: var(--cpim-primary-dark); font-size: 18px; }
        .sidebar nav { display: flex; flex-direction: column; flex-grow: 1; }
        .sidebar nav a {
            padding: 12px 20px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .sidebar nav a:hover, .sidebar nav a.active {
            background-color: var(--cpim-primary-soft);
            color: var(--cpim-primary-dark);
            text-decoration: none;
        }
        .main-content {
            flex-grow: 1;
            padding: 40px;
            max-width: 1200px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .logout-form { margin-top: auto; padding: 20px; }
        
        .menu-toggle { display: none; }
        
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); padding: 10px 0; }
            .sidebar-header { padding: 10px 20px; margin-bottom: 0; border-bottom: none; display: flex; justify-content: space-between; align-items: center; }
            .sidebar nav { display: none; }
            .sidebar.open nav { display: flex; }
            .sidebar.open .logout-form { display: block; }
            .logout-form { display: none; padding: 10px 20px; margin-top: 0; }
            .main-content { padding: 20px; width: 100%; box-sizing: border-box; overflow-x: hidden; }
            .menu-toggle { display: block; background: none; border: none; font-size: 24px; color: var(--cpim-primary-dark); cursor: pointer; }
            
            /* Forms responsive grid */
            .grid-form { grid-template-columns: 1fr !important; }
        }
    </style>
</head>
<body>
    <aside class="sidebar" id="admin-sidebar">
        <div class="sidebar-header">
            <h2>CPIM Admin</h2>
            <button class="menu-toggle" onclick="document.getElementById('admin-sidebar').classList.toggle('open')">☰</button>
        </div>
        <nav>
            <a href="/admin">Panel</a>
            <a href="/admin/calendario">Calendario</a>
            <a href="/admin/reservas">Reservas</a>
            <a href="/admin/agenda">Agenda CPIM</a>
            {% if request.session.rol == 'ADMINISTRACION' %}
            <a href="/admin/salones">Salones</a>
            <a href="/admin/historial">Historial</a>
            <a href="/admin/configuracion">Configuración</a>
            {% endif %}
            <a href="/admin/cuenta">Mi Cuenta</a>
        </nav>
        <form class="logout-form" action="/admin/logout" method="POST">
            <input type="hidden" name="csrf_token" value="{{ request.session.csrf_token }}">
            <button type="submit" class="btn btn-secondary" style="width: 100%;">Cerrar Sesión</button>
        </form>
    </aside>
    <main class="main-content">
        <div class="top-bar">
            <h2>{% block title %}{% endblock %}</h2>
        </div>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
