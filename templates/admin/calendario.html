{% extends "base_admin.html" %}
{% block title %}Calendario de Ocupaciones{% endblock %}

{% block content %}
<div class="container" style="padding: 0;">
    <div class="form-group" style="max-width: 400px; margin-bottom: 20px;">
        <label for="admin-salon-select">Filtrar por salón:</label>
        <select id="admin-salon-select" class="form-control">
            <option value="">Todos los salones</option>
            {% for s in salones %}
            <option value="{{ s.id }}">{{ s.nombre }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="calendar-wrapper">
        <div class="calendar-header">
            <button id="admin-btn-prev" class="btn btn-secondary">&laquo; Anterior</button>
            <h3 id="admin-month-label" style="font-size: 20px; font-weight: 500;"></h3>
            <button id="admin-btn-next" class="btn btn-secondary">Siguiente &raquo;</button>
        </div>
        
        <div class="calendar-grid">
            <div class="calendar-day-header">Lun</div>
            <div class="calendar-day-header">Mar</div>
            <div class="calendar-day-header">Mié</div>
            <div class="calendar-day-header">Jue</div>
            <div class="calendar-day-header">Vie</div>
            <div class="calendar-day-header">Sáb</div>
            <div class="calendar-day-header">Dom</div>
        </div>
        <div id="admin-calendar-days" class="calendar-grid" style="margin-top: 10px;"></div>
    </div>
    
    <div id="admin-day-detail" class="disponibilidad-panel" style="display: none;">
        <h3 id="admin-detail-date" style="margin-bottom: 20px; font-size: 20px;"></h3>
        <div id="admin-detail-slots"></div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    let currentDate = new Date();
    currentDate.setDate(1);
    
    const salonSelect = document.getElementById('admin-salon-select');
    const btnPrev = document.getElementById('admin-btn-prev');
    const btnNext = document.getElementById('admin-btn-next');
    const monthLabel = document.getElementById('admin-month-label');
    const daysGrid = document.getElementById('admin-calendar-days');
    const dayDetail = document.getElementById('admin-day-detail');
    const detailDate = document.getElementById('admin-detail-date');
    const detailSlots = document.getElementById('admin-detail-slots');
    
    let blocksData = [];
    
    salonSelect.addEventListener('change', loadMonth);
    btnPrev.addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() - 1); loadMonth(); });
    btnNext.addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() + 1); loadMonth(); });
    
    async function loadMonth() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
        monthLabel.textContent = `${monthNames[month]} ${year}`;
        
        const lastDay = new Date(year, month + 1, 0);
        const desde = `${year}-${String(month+1).padStart(2, '0')}-01`;
        const hasta = `${year}-${String(month+1).padStart(2, '0')}-${String(lastDay.getDate()).padStart(2, '0')}`;
        
        const salonId = salonSelect.value;
        const url = `/admin/api/calendario?desde=${desde}&hasta=${hasta}${salonId ? '&salon_id='+salonId : ''}`;
        
        try {
            const resp = await fetch(url);
            blocksData = await resp.json();
            renderCalendar(year, month);
        } catch (e) {
            console.error(e);
        }
    }
    
    function renderCalendar(year, month) {
        daysGrid.innerHTML = '';
        const firstDayIndex = (new Date(year, month, 1).getDay() || 7) - 1; 
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        for (let i = 0; i < firstDayIndex; i++) {
            daysGrid.appendChild(document.createElement('div'));
        }
        
        for (let d = 1; d <= daysInMonth; d++) {
            const dateStr = `${year}-${String(month+1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const dayEl = document.createElement('div');
            dayEl.className = 'calendar-day';
            dayEl.textContent = d;
            
            const dayBlocks = blocksData.filter(b => b.fecha === dateStr);
            if (dayBlocks.length > 0) {
                dayEl.style.borderBottom = '3px solid var(--cpim-primary)';
                dayEl.style.fontWeight = 'bold';
            }
            
            dayEl.addEventListener('click', () => {
                document.querySelectorAll('.calendar-day').forEach(el => el.classList.remove('seleccionado'));
                dayEl.classList.add('seleccionado');
                showDayDetail(dateStr, dayBlocks);
            });
            
            daysGrid.appendChild(dayEl);
        }
    }
    
    function showDayDetail(dateStr, blocks) {
        dayDetail.style.display = 'block';
        detailDate.textContent = dateStr;
        
        if (blocks.length === 0) {
            detailSlots.innerHTML = '<p>No hay ocupaciones este día.</p>';
            return;
        }
        
        let html = '<ul style="list-style: none; padding: 0;">';
        blocks.forEach(b => {
            const time = b.hora_inicio ? `${b.hora_inicio} - ${b.hora_fin}` : 'No especifica';
            const badge = b.tipo === 'RESERVA' ? 'var(--cpim-primary)' : 'var(--warning)';
            html += `
                <li style="padding: 15px; border: 1px solid var(--border); margin-bottom: 10px; border-radius: var(--radius-sm);">
                    <div style="font-weight: 500;">${time} | ${b.salon_nombre}</div>
                    <div style="color: var(--text-secondary); margin: 5px 0;">${b.titulo}</div>
                    <div>
                        <span style="font-size: 11px; padding: 2px 6px; background: var(--surface-secondary); border-radius: 4px; color: ${badge};">${b.tipo}</span>
                        ${b.tipo === 'RESERVA' ? `<span style="font-size: 11px; margin-left: 10px; padding: 2px 6px; background: var(--surface-secondary); border-radius: 4px;">Pago: ${b.estado_pago}</span>` : ''}
                    </div>
                </li>
            `;
        });
        html += '</ul>';
        detailSlots.innerHTML = html;
    }
    
    loadMonth();
});
</script>
{% endblock %}
