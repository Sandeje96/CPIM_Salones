{% extends "base_admin.html" %}
{% block title %}Editar Salón{% endblock %}

{% block content %}
<div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 30px; max-width: 600px;">
    <form method="POST" action="/admin/salones/{{ salon.id }}/editar">
        <input type="hidden" name="csrf_token" value="{{ request.session.csrf_token }}">
        
        <div class="form-group">
            <label>Nombre del salón *</label>
            <input type="text" name="nombre" class="form-control" value="{{ salon.nombre }}" required>
        </div>

        <div class="form-group">
            <label>Capacidad máxima *</label>
            <input type="number" name="capacidad" class="form-control" value="{{ salon.capacidad }}" required min="1">
        </div>
        
        <div class="form-group">
            <label>Descripción y Equipamiento</label>
            <textarea name="descripcion" class="form-control" rows="4">{{ salon.descripcion }}</textarea>
            <small style="color: var(--text-secondary);">Esta descripción es visible para el público al solicitar reservas.</small>
        </div>

        <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-top: 20px;">
            <input type="checkbox" name="activo" id="activo" {% if salon.activo %}checked{% endif %}>
            <label for="activo" style="margin: 0; cursor: pointer;">Salón Activo y Habilitado</label>
        </div>

        <div style="margin-top: 30px; display: flex; gap: 10px;">
            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
            <a href="/admin/salones" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
