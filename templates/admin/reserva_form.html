{% extends "base_admin.html" %}
{% block title %}Nueva Reserva{% endblock %}

{% block content %}
<div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 30px; max-width: 800px;">
    {% if error %}
    <div style="background: var(--danger-soft); color: var(--danger); padding: 15px; border-radius: var(--radius-sm); margin-bottom: 20px;">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/admin/reservas">
        <input type="hidden" name="csrf_token" value="{{ request.session.csrf_token }}">
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div class="form-group">
                <label>Salón *</label>
                <select name="salon_id" class="form-control" required>
                    <option value="">Seleccione...</option>
                    {% for s in salones %}
                    <option value="{{ s.id }}">{{ s.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Fecha *</label>
                <input type="date" name="fecha" class="form-control" required>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div class="form-group">
                <label>Hora de inicio *</label>
                <input type="time" name="hora_inicio" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Hora de fin *</label>
                <input type="time" name="hora_fin" class="form-control" required>
            </div>
        </div>

        <h4 style="margin: 30px 0 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px;">Datos del Cliente</h4>
        
        <div class="form-group">
            <label>Responsable *</label>
            <input type="text" name="responsable" class="form-control" required>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div class="form-group">
                <label>Teléfono</label>
                <input type="tel" name="telefono" class="form-control" inputmode="tel">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" class="form-control">
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div class="form-group">
                <label>Motivo / Tipo de evento</label>
                <input type="text" name="motivo" class="form-control">
            </div>
            <div class="form-group">
                <label>Asistentes estimados</label>
                <input type="number" name="asistentes" class="form-control" min="1">
            </div>
        </div>

        <h4 style="margin: 30px 0 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px;">Económico y Observaciones</h4>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div class="form-group">
                <label>Importe ($)</label>
                <input type="number" step="0.01" name="importe" class="form-control" value="0" min="0">
            </div>
            <div class="form-group">
                <label>Estado de pago</label>
                <select name="estado_pago" class="form-control">
                    <option value="PENDIENTE">Pendiente</option>
                    <option value="PAGADO">Pagado</option>
                    <option value="EXENTO">Exento</option>
                </select>
            </div>
        </div>
        
        <div class="form-group">
            <label>Observaciones internas</label>
            <textarea name="observaciones" class="form-control" rows="3"></textarea>
        </div>

        <div style="margin-top: 30px; display: flex; gap: 10px;">
            <button type="submit" class="btn btn-primary">Guardar Reserva</button>
            <a href="/admin/reservas" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
