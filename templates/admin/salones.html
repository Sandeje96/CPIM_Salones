{% extends "base_admin.html" %}
{% block title %}Salones{% endblock %}

{% block content %}
<div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
    {% for s in salones %}
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: start;">
            <h3 class="card-title">{{ s.nombre }}</h3>
            {% if s.activo %}
            <span style="padding: 2px 6px; font-size: 10px; background: var(--success-soft); color: var(--success); border-radius: 4px; font-weight: bold;">ACTIVO</span>
            {% else %}
            <span style="padding: 2px 6px; font-size: 10px; background: var(--danger-soft); color: var(--danger); border-radius: 4px; font-weight: bold;">INACTIVO</span>
            {% endif %}
        </div>
        <p style="font-weight: 500; font-size: 14px; margin-bottom: 5px;">Capacidad: {{ s.capacidad }}</p>
        <p class="card-desc" style="font-size: 14px;">{{ s.descripcion }}</p>
        
        <div class="card-actions" style="margin-top: 15px; border-top: 1px solid var(--border); padding-top: 15px;">
            <a href="/admin/salones/{{ s.id }}/editar" class="btn btn-secondary" style="font-size: 12px; padding: 5px 10px;">Editar Salón</a>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
